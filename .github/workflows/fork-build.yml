name: Fork binaries

on:
  push:
    branches: [main, fork/shaders-program-status]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            system: aarch64-darwin
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: cachix/cachix-action@v17
        with:
          name: roshbhatia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and test the exact source consumed by downstream flakes
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: nix build "github:$GITHUB_REPOSITORY/$GITHUB_SHA?dir=nix" --print-build-logs
      - name: Verify packaged binaries and publish the closure
        run: |
          result/bin/wezterm --version
          test -x result/bin/wezterm-gui
          test -x result/bin/wezterm-mux-server
          test -r result/share/wezterm/shaders/cursor-trail.wgsl
          nix path-info --recursive ./result | cachix push roshbhatia
          nix path-info --json ./result > nix-${{ matrix.system }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: nix-${{ matrix.system }}
          path: nix-${{ matrix.system }}.json
