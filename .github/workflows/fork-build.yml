name: Fork binaries

on:
  push:
    branches: [main, fork/shaders-program-status]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            system: aarch64-darwin
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: cachix/cachix-action@v17
        with:
          name: roshbhatia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and test the Nix package
        run: nix build ./nix --print-build-logs
      - name: Verify packaged binaries and publish the closure
        run: |
          result/bin/wezterm --version
          test -x result/bin/wezterm-gui
          test -x result/bin/wezterm-mux-server
          nix path-info --recursive ./result | cachix push roshbhatia
          nix path-info --json ./result > nix-${{ matrix.system }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: nix-${{ matrix.system }}
          path: nix-${{ matrix.system }}.json

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: env CI=yes ./get-deps
      - name: Test terminal and configuration behavior
        run: cargo test --locked -p wezterm-term -p config
      - name: Build native Apple Silicon binaries
        run: cargo build --locked --release -p wezterm -p wezterm-gui -p wezterm-mux-server -p strip-ansi-escapes
      - name: Test shader cross-compilation
        run: cargo test --locked -p wezterm-gui shader_import
      - name: Package the application
        env:
          BUILD_REASON: Fork
          TAG_NAME: fork-${{ github.sha }}
        run: |
          bash ci/deploy.sh
          for archive in WezTerm-*.zip; do shasum -a 256 "$archive" > "$archive.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            WezTerm-*.zip
            WezTerm-*.sha256

  release:
    needs: [nix, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the verified fork build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          tag="fork-$BUILD_SHA"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$BUILD_SHA" --prerelease \
              --title "WezTerm fork $BUILD_SHA" \
              --notes 'Apple Silicon application binaries and checksums. Nix closures for aarch64-darwin, aarch64-linux, and x86_64-linux are published to roshbhatia.cachix.org. See the attached Nix manifests for store paths.'
          fi
          gh release upload "$tag" --clobber WezTerm-*.zip WezTerm-*.sha256 nix-*.json
